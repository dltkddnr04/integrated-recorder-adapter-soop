name: SOOP Grid PoC

on:
  pull_request:
    paths:
      - "tests/streamlink-grid-poc/**"
      - ".github/workflows/soop-grid-poc.yml"
  push:
    branches: [main]
    paths:
      - "tests/streamlink-grid-poc/**"
      - ".github/workflows/soop-grid-poc.yml"

jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tests/streamlink-grid-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test environment
        run: python -m pip install -e ".[test]" "streamlink==8.6.2"
      - name: Verify clean Streamlink-only installation
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/soop-grid-clean"
          "$RUNNER_TEMP/soop-grid-clean/bin/python" -m pip install "streamlink==8.6.2"
          echo "SOOP_GRID_CLEAN_PYTHON=$RUNNER_TEMP/soop-grid-clean/bin/python" >> "$GITHUB_ENV"
        if: runner.os != 'Windows'
      - name: Verify clean Streamlink-only installation (Windows)
        shell: pwsh
        run: |
          $clean = Join-Path $env:RUNNER_TEMP "soop-grid-clean"
          python -m venv $clean
          $python = Join-Path $clean "Scripts/python.exe"
          & $python -m pip install "streamlink==8.6.2"
          "SOOP_GRID_CLEAN_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        if: runner.os == 'Windows'
      - name: Check generated one-file plugin
        run: python tools/build_singlefile.py --check
      - name: Run offline tests
        run: python -m pytest -q
      - name: Run bundled-object regression tests
        run: python tools/test_bundle.py -q
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
